name: GitHub Actions Review

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint + PR review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: actionlint (PR review comments)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: error
          level: warning

      - name: actionlint (push check)
        if: github.event_name != 'pull_request'
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          fail_level: error
          level: warning
