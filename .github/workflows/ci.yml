name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the current package.json version (Marketplace, Open VSX, GitHub release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      VSCODE_TEST_VERSION: 1.109.3
      RUNTIME_SMOKE_MAX_ATTEMPTS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run -s compile

      - name: Lint
        run: npm run -s lint

      - name: Unit + Smoke
        run: npm test --silent

      - name: P0 scenarios
        run: npm run -s test:p0

      - name: Release checks (semver/changelog/readme/assets)
        run: node scripts/check-release.js

      - name: VS Code runtime smoke
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run -s test:runtime
          else
            npm run -s test:runtime
          fi

      - name: CI perf delta gate (activation + first command)
        run: npm run -s test:ci-perf-gate

      - name: Perf budget
        run: node --test test/perf-budget.test.js

      - name: Package extension (dry-run)
        run: npx --yes @vscode/vsce package --no-yarn --out .artifacts/android-tools.vsix

      - name: Verify packaged runtime dependencies
        run: node scripts/verify-vsix.js .artifacts/android-tools.vsix

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-diagnostics-${{ matrix.os }}
          path: |
            .artifacts/runtime-flaky-report.json
            .artifacts/ci-perf-snapshot.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload VSIX artifact
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: android-tools-vsix
          path: .artifacts/android-tools.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Marketplace, Open VSX and GitHub release
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whether the extension version increased
        id: version
        env:
          RELEASE_BASE_SHA: ${{ github.event.before }}
          RELEASE_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/ci-release-version.js

      - name: Setup Node
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Build and verify release VSIX
        if: steps.version.outputs.changed == 'true'
        run: npm run release:package:marketplace

      - name: Publish to Visual Studio Marketplace
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          vsix=".artifacts/vscode-android-tools-${RELEASE_VERSION}.vsix"
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --skip-duplicate --packagePath "$vsix"
          else
            npx --yes @vscode/vsce publish --oidc --skip-duplicate --packagePath "$vsix"
          fi

      - name: Publish to Open VSX
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret is not configured"
            exit 1
          fi
          vsix=".artifacts/vscode-android-tools-${RELEASE_VERSION}.vsix"
          npx --yes ovsx publish "$vsix" --skip-duplicate

      - name: Publish GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          vsix=".artifacts/vscode-android-tools-${RELEASE_VERSION}.vsix"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$vsix" --clobber
          else
            gh release create "$tag" "$vsix" --title "$tag" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
