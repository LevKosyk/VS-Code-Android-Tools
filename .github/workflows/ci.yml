name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      NODE_VERSION: 22
      VSCODE_TEST_VERSION: 1.109.3
      RUNTIME_SMOKE_MAX_ATTEMPTS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run -s compile

      - name: Lint
        run: npm run -s lint

      - name: Unit + Smoke
        run: npm test --silent

      - name: P0 scenarios
        run: npm run -s test:p0

      - name: Release checks (semver/changelog/readme/assets)
        run: node scripts/check-release.js

      - name: VS Code runtime smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run -s test:runtime

      - name: VS Code runtime smoke (macOS)
        if: runner.os == 'macOS'
        run: npm run -s test:runtime

      - name: VS Code runtime smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run -s test:runtime

      - name: CI perf delta gate (activation + first command)
        run: npm run -s test:ci-perf-gate

      - name: Perf budget
        run: node --test test/perf-budget.test.js

      - name: Package extension (dry-run)
        run: npx --yes @vscode/vsce package --no-yarn --out .artifacts/android-tools.vsix

      - name: Verify packaged runtime dependencies
        run: node scripts/verify-vsix.js .artifacts/android-tools.vsix

      - name: Upload runtime flaky report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-flaky-report-${{ matrix.os }}
          path: .artifacts/runtime-flaky-report.json
          if-no-files-found: warn

      - name: Upload CI perf snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-perf-snapshot-${{ matrix.os }}
          path: .artifacts/ci-perf-snapshot.json
          if-no-files-found: warn

      - name: Upload VSIX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tools-vsix-${{ matrix.os }}
          path: .artifacts/android-tools.vsix
          if-no-files-found: warn

  publish:
    name: Publish Marketplace and GitHub release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the extension version increased
        id: version
        env:
          RELEASE_BASE_SHA: ${{ github.event.before }}
        run: node scripts/ci-release-version.js

      - name: Setup Node
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Build and verify release VSIX
        if: steps.version.outputs.changed == 'true'
        run: npm run release:package:marketplace

      - name: Publish to Visual Studio Marketplace
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npx --yes @vscode/vsce publish --oidc --skip-duplicate --packagePath ".artifacts/vscode-android-tools-${RELEASE_VERSION}.vsix"

      - name: Publish GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          vsix=".artifacts/vscode-android-tools-${RELEASE_VERSION}.vsix"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$vsix" --clobber
          else
            gh release create "$tag" "$vsix" --title "$tag" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
