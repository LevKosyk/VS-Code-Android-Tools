name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run -s compile

      - name: Unit + Smoke
        run: npm test --silent

      - name: P0 scenarios
        run: npm run -s test:p0

      - name: Perf budget
        run: node --test test/perf-budget.test.js
